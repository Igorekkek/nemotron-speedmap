target-version = "py310"
line-length = 120

[lint]
# Набор правил задан явно, чтобы проверка не менялась с новыми версиями ruff:
# E4, E7, E9, F — ошибки и опечатки; I — порядок импортов; B — частые ошибки (например, изменяемые значения по умолчанию).
select = ["E4", "E7", "E9", "F", "I", "B"]
ignore = ["B905"]  # zip() без strict= — дело вкуса, не ошибка

[lint.isort]
known-first-party = ["fastinfer"]
