[pytest]
testpaths = core/tests
# Тесты, которые ходят в сеть, тратят деньги, требуют GPU или долго идут, по умолчанию выключены
# (CLAUDE.md, правило 6). Включить: pytest -m network, pytest -m "paid" и т. д.
addopts = --strict-markers -m "not network and not paid and not gpu and not slow"
markers =
    network: ходит в сеть (Hugging Face, Nebius, скачивание моделей)
    paid: тратит деньги API Nebius
    gpu: нужна видеокарта
    slow: идёт дольше нескольких секунд
