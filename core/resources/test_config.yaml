# Test fixture for config.py: load -> validate -> expand_variants -> config_hash.
# No real model is loaded in tests; run_experiment should be tested with FakeEngine.

name: test-spec-sweep
family: 1
hypothesis: перебор длины черновика разворачивается в отдельные варианты и наследует флаги базы
device: any
mode: speed

model: nano-9b-v2
quant: Q4_K_M

dataset:
  name: spec_bench
  n: 8
  seed: 0
  tasks: [summarization, rag]

gen:
  max_tokens: 32
  temperature: 0.0
  reasoning: "off"

repeats: 2
budget_usd: 0
timeout_min: 5

base:
  engine: llamacpp
  flags:
    ngl: 99
    fa: "on"

variants:
  - name: ngram-mod
    flags:
      spec_type: ngram-mod

  - name: draft-4b
    flags:
      model_draft: "nano-4b:Q4_K_M"
      ngld: 99
    sweep:
      spec_draft_n_max: [1, 2]

notes: "fixture, not for real benchmark runs"