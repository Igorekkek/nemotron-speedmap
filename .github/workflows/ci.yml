name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Установить ядро
        run: pip install -e "core[dev]"
      - name: Стиль
        run: ruff check
      - name: Тесты без сети, денег и GPU
        run: pytest -m "not network and not paid and not gpu and not slow"
